name: Review CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Build and docs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check and build production bundle
        run: npm run build

      - name: Verify documentation links
        run: npm run verify:docs

      - name: Verify incoming missile models and scenario references
        run: npm run verify:threat-models && npm run verify:scenario-system

      - name: Verify seeker-specific defensive axes
        run: npm run verify:advanced-air-defense-axis
      - name: Verify scenario scale and Tacview coordinates
        run: npm run verify:world-scale && npm run verify:acmi-export
      - name: Verify radar units and RCS calibrations
        run: npm run verify:radar-model && npm run verify:radar-doppler && npm run verify:fleet-radar-scale && npm run verify:air-sensors && npm run verify:air-guidance
      - name: Verify ARM emitter health and runtime
        run: npm run verify:arm-emitter-health && npm run verify:arm-runtime
      - name: Verify ARM catalog ballistics
        run: node scripts/verify-catalog-record.mjs && node scripts/verify-arm-ballistics.mjs

      - name: Verify ARM seeker lifecycle and flight ceilings
        run: npm run verify:arm-lifecycle

      - name: Verify ARM track policy and SEAD integration
        run: npm run verify:arm-track-policy && npm run verify:arm-sead
      - name: Verify air missile engagement settlement
        run: npm run verify:air-engagement-settlement
      - name: Verify Soviet SEAD era and seeker coverage
        run: npm run verify:soviet-sead-era

      - name: Verify defensive side noise band
        run: npm run verify:advanced-air-defense-side-band

      - name: Check whitespace errors
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE_SHA"...HEAD
          elif [[ -n "${BEFORE_SHA:-}" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BEFORE_SHA" HEAD
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          fi

  domain-verification:
    name: Domain verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: http://127.0.0.1:5173/

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Start browser smoke server
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [[ -z "$browser" ]]; then
            echo "No Chrome/Chromium executable is available on this runner." >&2
            exit 1
          fi
          echo "CHROME_PATH=$browser" >> "$GITHUB_ENV"
          npm run dev -- --host 127.0.0.1 > "$RUNNER_TEMP/vite.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/vite.pid"
          for attempt in {1..30}; do
            if curl --fail --silent "$APP_URL" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/vite.log"
          exit 1

      - name: Verify application loads and advances one frame
        run: npm run verify:app-smoke

      - name: Verify setup fields isolate keyboard shortcuts
        run: npm run verify:setup-keyboard-focus

      - name: Verify five added anti-ship missile runtime paths
        run: npm run verify:new-antiship-runtime

      - name: Stop browser smoke server
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/vite.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/vite.pid")" 2>/dev/null || true
          fi
      - name: Upload Vite log after a smoke failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: domain-verification-vite-log
          path: ${{ runner.temp }}/vite.log
          if-no-files-found: ignore
          retention-days: 7
